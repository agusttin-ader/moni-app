  <body style="margin:0;background:#0b0c12;color:rgba(245,245,250,0.92)">
    <script>
      ;(function () {
        var h = location.hostname
        if (h !== 'localhost' && h !== '127.0.0.1') return
        if (sessionStorage.getItem('moni_sw_clean') === '1') return
        if (!('serviceWorker' in navigator)) return
        sessionStorage.setItem('moni_sw_clean', '1')
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          return Promise.all(regs.map(function (r) { return r.unregister() }))
        }).then(function () { location.reload() }).catch(function () {})
      })()
    </script>
    <noscript>
      <p style="padding:1.5rem;font-family:system-ui,sans-serif">
        Necesitás JavaScript para usar Moni.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
